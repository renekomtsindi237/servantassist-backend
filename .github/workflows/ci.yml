name: Backend CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  APP_ENV: testing
  APP_DEBUG: "False"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  JWT_SECRET_KEY: "ci-jwt-secret-key-minimum-32-chars-long-for-hs256!"
  JWT_ALGORITHM: HS256
  SECRET_KEY: "ci-app-secret-key-minimum-32-chars-long!"
  CLOUDFLARE_R2_ENDPOINT: "https://ci.r2.cloudflarestorage.com"
  CLOUDFLARE_R2_ACCESS_KEY: "ci-access-key"
  CLOUDFLARE_R2_SECRET_KEY: "ci-secret-key"
  CLOUDFLARE_R2_BUCKET: "ci-bucket"
  CLOUDFLARE_R2_PUBLIC_URL: "https://ci.r2.dev"
  COVERAGE_MIN: "65"

jobs:
  quality-security:
    name: Quality & Security Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-quality-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Black (blocking)
        run: black --check --diff src/ tests/

      - name: isort (blocking)
        run: isort --check-only --diff src/ tests/

      - name: Flake8 (blocking)
        run: flake8 src/ tests/

      - name: MyPy (blocking)
        run: mypy src/ --ignore-missing-imports --no-strict-optional

      - name: Bandit JSON report
        run: |
          bandit -r src/ \
            -f json -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            -x tests/

      - name: Bandit gate (blocking)
        run: |
          bandit -r src/ \
            --severity-level medium \
            --confidence-level medium \
            -x tests/

      - name: pip-audit (blocking)
        run: pip-audit --strict --desc

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short --junitxml=junit-unit.xml
      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: junit-unit.xml

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run security tests
        run: python -m pytest tests/security/ -v --tb=short --junitxml=junit-security.xml
      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: junit-security.xml

  usecase-tests:
    name: Use-Case Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run use-case tests
        run: python -m pytest tests/use_cases/ -v --tb=short --junitxml=junit-usecases.xml
      - name: Upload use-case test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usecase-test-results
          path: junit-usecases.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short --junitxml=junit-integration.xml
      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: junit-integration.xml

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run e2e tests
        run: python -m pytest tests/e2e/ -v --tb=short --junitxml=junit-e2e.xml
      - name: Upload e2e test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: junit-e2e.xml

  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run system tests
        run: python -m pytest tests/system/ -v --tb=short --junitxml=junit-system.xml
      - name: Upload system test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-results
          path: junit-system.xml

  storage-tests:
    name: Storage Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run storage tests
        run: python -m pytest tests/storage/ -v --tb=short --junitxml=junit-storage.xml
      - name: Upload storage test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-test-results
          path: junit-storage.xml

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: quality-security
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run performance tests
        run: python -m pytest tests/performance/ -v --tb=short --junitxml=junit-performance.xml
      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: junit-performance.xml

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, security-tests, usecase-tests, e2e-tests, integration-tests, system-tests, storage-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run coverage gate (progressive threshold)
        run: |
          python -m pytest tests/unit tests/security tests/use_cases tests/e2e tests/integration tests/system tests/storage \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=${COVERAGE_MIN} \
            --junitxml=junit-coverage.xml
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            junit-coverage.xml

  final-validation-rc:
    name: Final Validation & RC
    runs-on: ubuntu-latest
    needs: coverage-gate
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Full run (lint + unit + security + use-cases + e2e)
        run: |
          black --check src/ tests/
          isort --check-only src/ tests/
          flake8 src/ tests/
          mypy src/ --ignore-missing-imports --no-strict-optional
          python -m pytest tests/unit tests/security tests/use_cases tests/e2e tests/integration tests/system tests/storage \
            -v --tb=short --junitxml=junit-final-validation.xml
      - name: Build RC metadata
        run: |
          mkdir -p artifacts
          echo "RC_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > artifacts/rc-metadata.txt
          echo "RC_SHA=${GITHUB_SHA}" >> artifacts/rc-metadata.txt
          echo "RC_REF=${GITHUB_REF}" >> artifacts/rc-metadata.txt
          echo "COVERAGE_MIN=${COVERAGE_MIN}" >> artifacts/rc-metadata.txt
      - name: Upload RC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rc-validation
          path: |
            junit-final-validation.xml
            artifacts/rc-metadata.txt

  staging-migrations:
    name: Staging Migrations (Supabase)
    runs-on: ubuntu-latest
    needs: coverage-gate
    if: github.ref == 'refs/heads/staging'
    environment: staging
    env:
      APP_ENV: staging
      APP_DEBUG: "False"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
      SUPABASE_DB_DIRECT_URL: ${{ secrets.SUPABASE_DB_DIRECT_URL_STAGING }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL_STAGING }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Alembic migrations (staging)
        run: alembic upgrade head

  dev-migrations:
    name: Dev Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    needs: coverage-gate
    if: github.ref == 'refs/heads/dev'
    environment: development
    env:
      APP_ENV: development
      APP_DEBUG: "False"
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_DEV }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_DEV }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Alembic migrations (dev)
        run: alembic upgrade head

  production-migrations:
    name: Production Migrations (Supabase)
    runs-on: ubuntu-latest
    needs: coverage-gate
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      APP_ENV: production
      APP_DEBUG: "False"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
      SUPABASE_DB_DIRECT_URL: ${{ secrets.SUPABASE_DB_DIRECT_URL_PROD }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL_PROD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_PROD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_PROD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Alembic migrations (production)
        run: alembic upgrade head
