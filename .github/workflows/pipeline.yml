name: CI/CD — ServantAssist Backend

# ──────────────────────────────────────────────────────────────────────────
# Stratégie :
#   push dev/staging/main  → CI complet (qualité + 8 suites de tests)
#   push main              → CI + Build Docker + Bootstrap VPS + Deploy Staging
#   workflow_dispatch      → CI + (deploy staging OU production selon inputs)
#   pull_request           → CI uniquement
# ──────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Environnement de déploiement"
        required: false
        default: staging
        type: choice
        options: [staging, production]
      confirm_prod:
        description: "Production uniquement : taper exactement 'DEPLOY' pour confirmer"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/servantassist-backend
  # Environnement de test CI
  APP_ENV: testing
  APP_DEBUG: "False"
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  JWT_SECRET_KEY: "ci-jwt-secret-key-minimum-32-chars-long-for-hs256!"
  JWT_ALGORITHM: HS256
  SECRET_KEY: "ci-app-secret-key-minimum-32-chars-long!"
  CLOUDFLARE_R2_ENDPOINT: "https://ci.r2.cloudflarestorage.com"
  CLOUDFLARE_R2_ACCESS_KEY: "ci-access-key"
  CLOUDFLARE_R2_SECRET_KEY: "ci-secret-key"
  CLOUDFLARE_R2_BUCKET: "ci-bucket"
  CLOUDFLARE_R2_PUBLIC_URL: "https://ci.r2.dev"
  COVERAGE_MIN: "62"

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # JOB 1 — Quality & Security Gates  (toutes branches + PRs)
  # ════════════════════════════════════════════════════════════════════════
  quality:
    name: "Quality & Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Black
        run: black --check --diff src/ tests/
      - name: Normalize Alembic imports
        run: python -m isort src/infrastructure/database/migrations
      - name: isort
        run: isort --check-only --diff src/ tests/
      - name: Flake8
        run: flake8 src/ tests/
      - name: MyPy
        continue-on-error: true
        run: mypy src/ --ignore-missing-imports --no-strict-optional
      - name: Bandit
        run: bandit -r src/ --severity-level medium --confidence-level medium -x tests/
      - name: pip-audit
        run: pip-audit --strict --desc

  # ════════════════════════════════════════════════════════════════════════
  # JOBs 2-9 — Suites de tests en parallèle  (needs: quality)
  # ════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "Unit Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/unit/ -v --tb=short --junitxml=junit-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml

  security-tests:
    name: "Security Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/security/ -v --tb=short --junitxml=junit-security.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-security
          path: junit-security.xml

  usecase-tests:
    name: "Use-Case Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/use_cases/ -v --tb=short --junitxml=junit-usecases.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-usecases
          path: junit-usecases.xml

  integration-tests:
    name: "Integration Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/integration/ -v --tb=short --junitxml=junit-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml

  e2e-tests:
    name: "E2E Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/e2e/ -v --tb=short --junitxml=junit-e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: junit-e2e.xml

  system-tests:
    name: "System Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/system/ -v --tb=short --junitxml=junit-system.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-system
          path: junit-system.xml

  storage-tests:
    name: "Storage Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/storage/ -v --tb=short --junitxml=junit-storage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-storage
          path: junit-storage.xml

  performance-tests:
    name: "Performance Tests"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/performance/ -v --tb=short --junitxml=junit-performance.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-performance
          path: junit-performance.xml

  # ════════════════════════════════════════════════════════════════════════
  # JOB 10 — Coverage Gate
  # ════════════════════════════════════════════════════════════════════════
  coverage-gate:
    name: "Coverage Gate (≥ 62%)"
    needs:
      - unit-tests
      - security-tests
      - usecase-tests
      - integration-tests
      - e2e-tests
      - system-tests
      - storage-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Coverage
        run: |
          pytest tests/unit tests/security tests/use_cases tests/e2e \
                 tests/integration tests/system tests/storage \
            --cov=src --cov-report=xml:coverage.xml --cov-report=term-missing \
            --cov-fail-under=${COVERAGE_MIN} --junitxml=junit-coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-artifacts
          path: |
            coverage.xml
            junit-coverage.xml

  # ════════════════════════════════════════════════════════════════════════
  # JOBs 11-13 — Migrations Alembic CI (branch-specific)
  # ════════════════════════════════════════════════════════════════════════
  staging-migrations:
    name: "Staging Migrations (Supabase)"
    needs: coverage-gate
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_ENV: staging
      APP_DEBUG: "False"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_STAGING }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
      SUPABASE_DB_DIRECT_URL: ${{ secrets.SUPABASE_DB_DIRECT_URL_STAGING }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL_STAGING }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_STAGING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head

  dev-migrations:
    name: "Dev Migrations (PostgreSQL)"
    needs: coverage-gate
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: development
    env:
      APP_ENV: development
      APP_DEBUG: "False"
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_DEV }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head

  production-migrations:
    name: "Production Migrations (Supabase)"
    needs: coverage-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      APP_DEBUG: "False"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_PROD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PROD }}
      SUPABASE_DB_DIRECT_URL: ${{ secrets.SUPABASE_DB_DIRECT_URL_PROD }}
      SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL_PROD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY_PROD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY_PROD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head

  # ════════════════════════════════════════════════════════════════════════
  # JOB 14 — Build & Push image Docker  (main/staging push + dispatch)
  # ════════════════════════════════════════════════════════════════════════
  build-push:
    name: "Build & Push Image (GHCR)"
    needs: coverage-gate
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4
      - name: Short SHA
        id: sha
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build & Push (production stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════
  # JOB 15 — Bootstrap VPS Staging
  # ════════════════════════════════════════════════════════════════════════
  bootstrap-staging:
    name: "Bootstrap VPS Staging"
    needs: build-push
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"

      - name: Bootstrap Docker + Compose + IPv6
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail

            # ── Docker ────────────────────────────────────────────────────
            if ! command -v docker &>/dev/null; then
              curl -fsSL https://get.docker.com | sh
              usermod -aG docker "$USER"
              systemctl enable --now docker
              echo "==> Docker installé : $(docker --version)"
            else
              echo "==> Docker OK : $(docker --version)"
            fi

            # ── Docker Compose (plugin v2) ─────────────────────────────
            if ! docker compose version &>/dev/null 2>&1; then
              mkdir -p /usr/local/lib/docker/cli-plugins
              COMPOSE_URL="https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)"
              curl -SL "$COMPOSE_URL" -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              echo "==> Compose installé : $(docker compose version)"
            else
              echo "==> Compose OK : $(docker compose version)"
            fi

            # ── IPv6 + ip6tables (Supabase IPv6-only depuis containers) ──
            DAEMON_JSON="/etc/docker/daemon.json"
            IP6_NEED_RESTART=false
            if [ ! -f "$DAEMON_JSON" ]; then
              echo '{"ipv6": true, "fixed-cidr-v6": "fd00::/80", "ip6tables": true}' > "$DAEMON_JSON"
              IP6_NEED_RESTART=true
            elif ! python3 -c "import json; d=json.load(open('$DAEMON_JSON')); exit(0 if d.get('ip6tables') else 1)" 2>/dev/null; then
              python3 -c "import json; d=json.load(open('/etc/docker/daemon.json')); d.update({'ipv6':True,'ip6tables':True}); d.setdefault('fixed-cidr-v6','fd00::/80'); json.dump(d,open('/etc/docker/daemon.json','w'),indent=2)"
              IP6_NEED_RESTART=true
            fi
            if $IP6_NEED_RESTART; then
              echo "==> Redémarrage Docker (activation ip6tables)..."
              systemctl restart docker
              sleep 10
            else
              echo "==> Docker IPv6 déjà configuré"
            fi

            # ip6tables MASQUERADE géré automatiquement par Docker daemon (ip6tables:true dans daemon.json)

            # ── Fix PMTUD blackhole IPv6 (TCP RST lors des pulls GHCR/Fastly) ──
            # gai.conf : ignoré par Docker daemon (Go a son propre resolver) → ip6tables
            # Clamp MSS à 1280 (MTU min IPv6) — ne dépend PAS de PMTUD fonctionnel
            ip6tables -t mangle -D POSTROUTING -p tcp --tcp-flags SYN,RST SYN \
              -j TCPMSS --clamp-mss-to-pmtu 2>/dev/null || true
            ip6tables -t mangle -C POSTROUTING -p tcp --tcp-flags SYN,RST SYN \
              -j TCPMSS --set-mss 1280 2>/dev/null || \
            ip6tables -t mangle -A POSTROUTING -p tcp --tcp-flags SYN,RST SYN \
              -j TCPMSS --set-mss 1280 2>/dev/null || true
            # REJECT IPv6 vers Fastly/GHCR → Go happy-eyeballs bascule IPv4 immédiatement
            # (REJECT renvoie TCP RST instantané vs DROP qui attend le timeout complet)
            ip6tables -C OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 -j REJECT 2>/dev/null || \
              ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
                -j REJECT --reject-with tcp-reset 2>/dev/null || true
            echo "==> ip6tables: MSS=1280 + REJECT Fastly-IPv6 configurés"

            mkdir -p /opt/servantassist/backups /opt/servantassist/logs
            echo "==> Bootstrap OK"

  # ════════════════════════════════════════════════════════════════════════
  # JOB 16 — Deploy Staging  (auto sur push main/staging, ou dispatch)
  # ════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: "Deploy → Staging"
    needs: bootstrap-staging
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'production')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    outputs:
      deployed: ${{ steps.deploy.outcome }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"

      - name: Deploy
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.build-push.outputs.sha_short }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY_STAGING }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          envs: GHCR_USERNAME,GHCR_READ_TOKEN,SHA,FIELD_ENCRYPTION_KEY
          command_timeout: 30m
          script: |
            set -euo pipefail
            ENVFILE="/opt/servantassist/servantassist-backend/.env.staging"
            DC="docker compose --env-file $ENVFILE -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"

            echo "==> Pull code"
            cd /opt/servantassist/servantassist-backend
            find .git/objects -type d -exec chmod u+rwx {} \; 2>/dev/null || true
            find .git/objects -type f -exec chmod u+rw {} \; 2>/dev/null || true
            find .git/objects -type f -size 0 -delete 2>/dev/null || true
            git fetch origin main
            git reset --hard FETCH_HEAD

            # Garantit que FIELD_ENCRYPTION_KEY est toujours présente dans .env.staging
            # (idempotent : ne remplace pas si déjà définie avec la même valeur)
            if [ -n "${FIELD_ENCRYPTION_KEY:-}" ]; then
              if grep -q '^FIELD_ENCRYPTION_KEY=' "$ENVFILE" 2>/dev/null; then
                sed -i "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}|" "$ENVFILE"
              else
                echo "FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}" >> "$ENVFILE"
              fi
              echo "==> FIELD_ENCRYPTION_KEY synchronisée dans $ENVFILE"
            fi

            echo "==> Login GHCR"
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            # Forcer IPv4 pour Docker pulls — REJECT renvoie TCP RST immédiat, Go
            # happy-eyeballs bascule sur IPv4 en ms (DROP attendait le timeout complet)
            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || \
            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT 2>/dev/null || true

            echo "==> Pull nouvelle image (avec retry)"
            PULL_OK=0
            for attempt in 1 2 3 4 5; do
              if $DC pull backend; then
                PULL_OK=1
                break
              fi
              echo "==> Pull failed (attempt ${attempt}/5), retrying..."
              sleep $((attempt * 5))
            done

            # Restaurer IPv6 vers Fastly
            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || \
            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT 2>/dev/null || true

            if [ "$PULL_OK" -ne 1 ]; then
              echo "==> ERROR: unable to pull backend image from GHCR after retries"
              exit 1
            fi

            echo "==> Migrations Alembic"
            $DC --profile migrate run --rm migrate

            echo "==> Sauvegarde référence rollback"
            CURRENT=$($DC ps -q backend 2>/dev/null | head -1)
            if [ -n "$CURRENT" ]; then
              IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CURRENT" 2>/dev/null || echo "")
              [ -n "$IMAGE" ] && echo "$IMAGE" > /opt/servantassist/.rollback_image_staging
            fi

            echo "==> Arrêt propre (compose)"
            $DC down --remove-orphans 2>/dev/null || true

            echo "==> Nettoyage résidus — par nom"
            docker rm -f sa-backend-diag servantassist-backend-backend-1 2>/dev/null || true

            echo "==> Nettoyage résidus — par image (capture containers hors compose)"
            docker ps -aq --filter 'ancestor=ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging' \
              | xargs -r docker rm -f 2>/dev/null || true

            echo "==> Nettoyage résidus — par nom pattern"
            docker ps -aq --filter 'name=servantassist' | xargs -r docker rm -f 2>/dev/null || true

            echo "==> Port 9099 après nettoyage:"
            ss -tlnp 2>/dev/null | grep ':9099 ' && echo "WARN: port 9099 occupé" || echo "  (libre)"

            echo "==> Démarrage (attente healthchecks)"
            if ! $DC up -d --wait --wait-timeout 180 2>&1; then
              echo ""
              echo "==> ERREUR — état de tous les conteneurs:"
              for ct in servantassist-backend-backend-1 servantassist-staging-lb \
                        servantassist-staging-redis servantassist-staging-celery \
                        servantassist-staging-beat; do
                echo "  $ct: $(docker inspect $ct \
                  --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{.State.Health.Status}}' \
                  2>/dev/null || echo 'not found')"
              done
              echo ""
              echo "==> Logs backend (50 dernières lignes):"
              docker logs servantassist-backend-backend-1 --tail 50 2>&1 || true
              echo ""
              echo "==> Logs celery-beat (50 dernières lignes):"
              docker logs servantassist-staging-beat --tail 50 2>&1 || true
              echo ""
              echo "==> Logs celery-worker (20 dernières lignes):"
              docker logs servantassist-staging-celery --tail 20 2>&1 || true
              exit 1
            fi
            echo "==> Deploy OK: sha=${SHA}"

      - name: Health check public
        id: healthcheck
        run: |
          for i in 1 2 3 4 5; do
            sleep 15
            if curl -fsS "${{ vars.STAGING_URL }}/health" 2>/dev/null; then
              echo "==> Health OK"
              exit 0
            fi
            echo "Tentative $i/5 échouée — attente..."
          done
          echo "Health check final échoué"
          exit 1

      - name: Rollback automatique
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail
            ENVFILE="/opt/servantassist/servantassist-backend/.env.staging"
            DC="docker compose --env-file $ENVFILE -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"
            ROLLBACK=$(cat /opt/servantassist/.rollback_image_staging 2>/dev/null || echo "")
            if [ -z "$ROLLBACK" ]; then echo "Aucune image de rollback"; exit 1; fi
            echo "==> ROLLBACK vers: $ROLLBACK"
            docker pull "$ROLLBACK"
            $DC down --remove-orphans 2>/dev/null || true
            IMAGE_TAG="${ROLLBACK##*:}" $DC up -d --wait --timeout 60
            echo "==> Rollback OK"

  # ════════════════════════════════════════════════════════════════════════
  # JOB 17 — Deploy Production  (manuel uniquement, confirmation requise)
  # ════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: "Deploy → Production"
    needs: [coverage-gate, build-push]
    if: |
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.deploy_env == 'production'
      && github.event.inputs.confirm_prod == 'DEPLOY'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.PROD_HOST }}"
          echo "::add-mask::${{ secrets.PROD_SSH_KEY }}"

      - name: Deploy
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.build-push.outputs.sha_short }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY_PROD }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_READ_TOKEN,SHA,FIELD_ENCRYPTION_KEY
          command_timeout: 15m
          script: |
            set -euo pipefail
            ENVFILE="/opt/servantassist/servantassist-backend/.env.production"
            DC="docker compose --env-file $ENVFILE -f /opt/servantassist/servantassist-backend/docker-compose.production.yml"

            echo "==> Pull code (production)"
            cd /opt/servantassist/servantassist-backend
            find .git/objects -type d -exec chmod u+rwx {} \; 2>/dev/null || true
            find .git/objects -type f -exec chmod u+rw {} \; 2>/dev/null || true
            find .git/objects -type f -size 0 -delete 2>/dev/null || true
            git fetch origin main
            git reset --hard FETCH_HEAD

            # Garantit que FIELD_ENCRYPTION_KEY est toujours présente dans .env.production
            if [ -n "${FIELD_ENCRYPTION_KEY:-}" ]; then
              if grep -q '^FIELD_ENCRYPTION_KEY=' "$ENVFILE" 2>/dev/null; then
                sed -i "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}|" "$ENVFILE"
              else
                echo "FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}" >> "$ENVFILE"
              fi
              echo "==> FIELD_ENCRYPTION_KEY synchronisée dans $ENVFILE"
            fi

            echo "==> Login GHCR"
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            # Forcer IPv4 pour Docker pulls (même fix que staging)
            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || \
            ip6tables -I OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT 2>/dev/null || true

            echo "==> Pull image (avec retry)"
            PULL_OK=0
            for attempt in 1 2 3 4 5; do
              if $DC pull backend; then
                PULL_OK=1
                break
              fi
              echo "==> Pull failed (attempt ${attempt}/5), retrying..."
              sleep $((attempt * 5))
            done

            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT --reject-with tcp-reset 2>/dev/null || \
            ip6tables -D OUTPUT -p tcp -d 2606:50c0::/32 --dport 443 \
              -j REJECT 2>/dev/null || true

            if [ "$PULL_OK" -ne 1 ]; then
              echo "==> ERROR: unable to pull backend image from GHCR after retries"
              exit 1
            fi

            echo "==> Sauvegarde rollback"
            CURRENT=$($DC ps -q backend 2>/dev/null | head -1)
            if [ -n "$CURRENT" ]; then
              IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CURRENT" 2>/dev/null || echo "")
              [ -n "$IMAGE" ] && echo "$IMAGE" > /opt/servantassist/.rollback_image_prod
            fi

            echo "==> Migrations Alembic (production)"
            $DC --profile migrate run --rm migrate

            echo "==> Arrêt propre"
            $DC down --remove-orphans 2>/dev/null || true

            echo "==> Démarrage production"
            $DC up -d --wait --timeout 180
            echo "==> Deploy Production OK: sha=${SHA}"

      - name: Health check production
        id: healthcheck
        run: |
          for i in 1 2 3 4 5; do
            sleep 20
            if curl -fsS "${{ vars.PRODUCTION_URL }}/api/v1/health" 2>/dev/null; then
              echo "==> Production OK"
              exit 0
            fi
            echo "Tentative $i/5 échouée"
          done
          echo "Health check production échoué"
          exit 1

      - name: Rollback production
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            ENVFILE="/opt/servantassist/servantassist-backend/.env.production"
            DC="docker compose --env-file $ENVFILE -f /opt/servantassist/servantassist-backend/docker-compose.production.yml"
            ROLLBACK=$(cat /opt/servantassist/.rollback_image_prod 2>/dev/null || echo "")
            if [ -z "$ROLLBACK" ]; then echo "Aucune image de rollback — intervention manuelle requise"; exit 1; fi
            echo "==> ROLLBACK PRODUCTION vers: $ROLLBACK"
            docker pull "$ROLLBACK"
            $DC down --remove-orphans 2>/dev/null || true
            $DC up -d --wait --timeout 120
            echo "==> Rollback production OK"

  # ════════════════════════════════════════════════════════════════════════
  # JOB 18 — Résumé Pipeline  (toujours affiché)
  # ════════════════════════════════════════════════════════════════════════
  summary:
    name: "Résumé Pipeline"
    needs:
      - quality
      - coverage-gate
      - build-push
      - deploy-staging
      - deploy-production
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rapport
        run: |
          echo "## Résumé CI/CD — ServantAssist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Étape           | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality & Sec.  | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage Gate   | ${{ needs.coverage-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build / Push    | ${{ needs.build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging  | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Prod     | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Branche | SHA |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ github.ref_name }}\` | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
