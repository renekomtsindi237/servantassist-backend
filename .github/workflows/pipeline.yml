name: CI/CD — ServantAssist Backend

# ──────────────────────────────────────────────────────────────────────────
# Stratégie par branche :
#   push main/staging  → CI + Build + Bootstrap serveur + Deploy + Health
#   push develop/*     → CI uniquement
#   pull_request *     → CI uniquement
#   workflow_dispatch  → CI + Deploy manuel (si branche main/staging)
# ──────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/servantassist-backend
  PYTHON_VERSION: "3.12"
  IS_DEPLOY_BRANCH: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}

# ══════════════════════════════════════════════════════════════════════════
# JOB 1 : CI — Tests, Qualité, Sécurité  (toutes branches + PRs)
# ══════════════════════════════════════════════════════════════════════════
jobs:
  ci:
    name: "CI — Tests & Qualité"
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: "False"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      JWT_SECRET_KEY: "ci-jwt-secret-key-minimum-32-chars-long-for-hs256!"
      JWT_ALGORITHM: HS256
      SECRET_KEY: "ci-app-secret-key-minimum-32-chars-long!"
      CLOUDFLARE_R2_ENDPOINT: "https://ci.r2.cloudflarestorage.com"
      CLOUDFLARE_R2_ACCESS_KEY: "ci-access-key"
      CLOUDFLARE_R2_SECRET_KEY: "ci-secret-key"
      CLOUDFLARE_R2_BUCKET: "ci-bucket"
      CLOUDFLARE_R2_PUBLIC_URL: "https://ci.r2.dev"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff — warning only)
        run: ruff check src/ tests/ --output-format=github --exit-zero

      - name: Format check (ruff — warning only)
        run: ruff format src/ tests/ --check || true

      - name: Type check (mypy)
        run: mypy src/ --ignore-missing-imports --no-error-summary || true

      - name: Security scan (bandit)
        run: bandit -r src/ -ll -q || true

      - name: Unit tests
        run: |
          pytest tests/unit/ \
            --tb=short -q \
            --cov=src --cov-report=term-missing \
            --cov-fail-under=40 \
            -x

      - name: Integration tests
        run: |
          pytest tests/integration/ \
            --tb=short -q -x \
            --ignore=tests/integration/test_websocket.py \
            || true

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 : Build & Push image Docker  (push main/staging uniquement)
  # ══════════════════════════════════════════════════════════════════════════
  build-push:
    name: "Build & Push Image (GHCR)"
    needs: [ci]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & Push (non-root production stage)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3 : Bootstrap serveur — installe Docker/Compose si absent
  # ══════════════════════════════════════════════════════════════════════════
  server-bootstrap:
    name: "Bootstrap VPS (Docker + Compose)"
    needs: [build-push]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
    runs-on: ubuntu-latest

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"

      - name: Vérifier et installer Docker + Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail

            # ── Docker ──────────────────────────────────────────────────────
            if ! command -v docker &>/dev/null; then
              echo "==> Installation Docker..."
              curl -fsSL https://get.docker.com | sh
              usermod -aG docker "$USER"
              systemctl enable --now docker
              echo "==> Docker installé : $(docker --version)"
            else
              echo "==> Docker OK : $(docker --version)"
            fi

            # ── Docker Compose (plugin v2) ───────────────────────────────────
            if ! docker compose version &>/dev/null 2>&1; then
              echo "==> Installation Docker Compose plugin..."
              mkdir -p /usr/local/lib/docker/cli-plugins
              COMPOSE_URL="https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)"
              curl -SL "$COMPOSE_URL" -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              echo "==> Compose installé : $(docker compose version)"
            else
              echo "==> Docker Compose OK : $(docker compose version)"
            fi

            # ── Répertoire application ──────────────────────────────────────
            mkdir -p /opt/servantassist/backups /opt/servantassist/logs
            echo "==> Bootstrap OK"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 4 : Déploiement staging (rolling update + rollback auto)
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: "Deploy → Staging"
    needs: [server-bootstrap]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    outputs:
      deployed: ${{ steps.deploy.outcome }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"
          echo "::add-mask::${{ secrets.GHCR_READ_TOKEN }}"

      - name: Sauvegarder image courante (rollback reference)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            DC="docker compose --env-file /opt/servantassist/servantassist-backend/.env.staging -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"
            CURRENT=$($DC ps -q backend 2>/dev/null | head -1)
            if [ -n "$CURRENT" ]; then
              IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CURRENT" 2>/dev/null || echo "")
              echo "$IMAGE" > /opt/servantassist/.rollback_image_staging
              echo "==> Rollback reference: $IMAGE"
            fi

      - name: Deploy — Rolling update
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.build-push.outputs.sha_short }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          envs: GHCR_USERNAME,GHCR_READ_TOKEN,SHA
          script: |
            set -euo pipefail
            DC="docker compose --env-file /opt/servantassist/servantassist-backend/.env.staging -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"

            echo "==> Pull code"
            cd /opt/servantassist/servantassist-backend
            git pull origin main

            echo "==> Login GHCR"
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            echo "==> Pull nouvelle image"
            $DC pull backend

            echo "==> Migrations Alembic"
            $DC --profile migrate run --rm migrate

            echo "==> Rolling update (scale 2 → 3 → 2)"
            $DC up -d --scale backend=3 --no-recreate
            sleep 20

            OLD=$($DC ps -q backend | tail -1)
            [ -n "$OLD" ] && docker stop --time=30 "$OLD" && docker rm "$OLD"

            $DC up -d --scale backend=2 --no-recreate
            echo "==> Deploy OK: sha=${SHA}"

      - name: Health check (3 tentatives)
        id: healthcheck
        run: |
          for i in 1 2 3; do
            sleep 10
            if curl -fsS "${{ vars.STAGING_URL }}/api/v1/health"; then
              echo "==> Health OK"
              exit 0
            fi
            echo "Tentative $i/3 échouée"
          done
          echo "Health check final échoué"
          exit 1

      - name: Rollback automatique (si health check échoue)
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail
            DC="docker compose --env-file /opt/servantassist/servantassist-backend/.env.staging -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"
            ROLLBACK=$(cat /opt/servantassist/.rollback_image_staging 2>/dev/null || echo "")

            if [ -z "$ROLLBACK" ]; then
              echo "Aucune image de rollback disponible"
              exit 1
            fi

            echo "==> ROLLBACK vers: $ROLLBACK"
            docker pull "$ROLLBACK"
            REGISTRY_IMAGE="$ROLLBACK" $DC up -d --force-recreate --scale backend=2 backend
            sleep 15
            curl -fsS "http://localhost:8000/health" && echo "==> Rollback OK" || echo "==> Rollback echoue — intervention manuelle requise"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 5 : Résumé du pipeline (toujours affiché)
  # ══════════════════════════════════════════════════════════════════════════
  summary:
    name: "Résumé Pipeline"
    needs: [ci, build-push, server-bootstrap, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rapport
        run: |
          echo "## Résumé CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CI Tests    | ${{ needs.ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build/Push  | ${{ needs.build-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bootstrap   | ${{ needs.server-bootstrap.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy      | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branche     | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA         | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
