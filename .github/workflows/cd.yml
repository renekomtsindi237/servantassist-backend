# ──────────────────────────────────────────────────────────────────────────
# ServantAssist Backend — CD Pipeline
# Triggered on successful CI on main branch.
# Stages: Build Docker → Push to GHCR → Deploy Staging → Deploy Production
# ──────────────────────────────────────────────────────────────────────────
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Permettre le déclenchement manuel
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

defaults:
  run:
    working-directory: servantassist-backend

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/servantassist-backend

jobs:
  # ════════════════════════════════════════════════════════════════════
  # 1. Build & Push Docker Image
  # ════════════════════════════════════════════════════════════════════
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Ne s'exécute que si le CI a réussi (ou dispatch manuel)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: servantassist-backend
          file: servantassist-backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  # ════════════════════════════════════════════════════════════════════
  # 2. Deploy to Staging
  # ════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/servantassist
            docker compose pull backend
            docker compose up -d backend
            docker compose exec backend alembic upgrade head
            echo "Staging deployment complete"

      - name: Health check
        run: |
          echo "Waiting for service to start..."
          sleep 10
          curl -f "${{ vars.STAGING_URL }}/health" || exit 1
          echo "Health check passed"

  # ════════════════════════════════════════════════════════════════════
  # 3. Deploy to Production (manual approval)
  # ════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/servantassist
            docker compose pull backend
            docker compose up -d backend
            docker compose exec backend alembic upgrade head
            echo "Production deployment complete"

      - name: Health check
        run: |
          echo "Waiting for service to start..."
          sleep 15
          curl -f "${{ vars.PRODUCTION_URL }}/health" || exit 1
          echo "Production health check passed"

      - name: Notify deployment
        if: success()
        run: |
          echo "Production deployment successful!"
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ needs.build.outputs.image_tag }}"

