name: CD — Staging (bêta)

# Déclenché automatiquement après la réussite du CI sur main
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/servantassist-backend

jobs:
  # ── Job 1 : Build & push l'image sur GHCR ──────────────────────────────
  build-and-push:
    name: Build & Push image (GHCR)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Short SHA
        id: sha
        run: echo "sha_short=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2 : Déploiement sur le VPS staging ─────────────────────────────
  deploy:
    name: Deploy → Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.STAGING_HOST }}"
          echo "::add-mask::${{ secrets.STAGING_USER }}"
          echo "::add-mask::${{ secrets.STAGING_SSH_KEY }}"
          echo "::add-mask::${{ secrets.GHCR_READ_TOKEN }}"

      - name: Save current image tag (rollback reference)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            DC="docker compose -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"
            CURRENT=$($DC ps -q backend 2>/dev/null | head -1)
            if [ -n "$CURRENT" ]; then
              IMAGE=$(docker inspect --format='{{.Config.Image}}' "$CURRENT" 2>/dev/null || echo "")
              echo "$IMAGE" > /opt/servantassist/.rollback_image_staging
              echo "==> Image de rollback sauvegardée : $IMAGE"
            fi

      - name: Deploy via SSH (rolling update)
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          SHA: ${{ needs.build-and-push.outputs.sha_short }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          envs: GHCR_USERNAME,GHCR_READ_TOKEN,SHA
          script: |
            set -euo pipefail
            DC="docker compose -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"

            echo "==> Mise à jour du code"
            cd /opt/servantassist/servantassist-backend
            git pull origin main

            echo "==> Pull de la nouvelle image"
            printf '%s' "${GHCR_READ_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
            $DC pull backend

            echo "==> Migrations Alembic"
            $DC --profile migrate run --rm migrate

            echo "==> Rolling update — scale 3 réplicas (nouveau + 2 anciens)"
            $DC up -d --scale backend=3 --no-recreate
            sleep 25

            echo "==> Suppression des anciens réplicas"
            OLD=$($DC ps -q backend | tail -2)
            for C in $OLD; do
              docker stop --time=30 "$C" && docker rm "$C"
              sleep 10
            done

            $DC up -d --scale backend=2 --no-recreate
            echo "✅ Rolling update terminé : ${SHA}"

      - name: Health check
        id: healthcheck
        run: |
          sleep 15
          for i in 1 2 3; do
            curl -fsS "${{ vars.STAGING_URL }}/api/v1/health" && break
            [ $i -eq 3 ] && echo "❌ Health check échoué" && exit 1
            sleep 10
          done
          echo "✅ Staging opérationnel"

      - name: Rollback automatique si health check échoue
        if: failure() && steps.deploy.outcome == 'success'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            set -euo pipefail
            DC="docker compose -f /opt/servantassist/servantassist-backend/docker-compose.staging.yml"
            ROLLBACK_IMAGE=$(cat /opt/servantassist/.rollback_image_staging 2>/dev/null || echo "")

            if [ -z "$ROLLBACK_IMAGE" ]; then
              echo "⚠️  Aucune image de rollback disponible"
              exit 1
            fi

            echo "==> 🔄 ROLLBACK vers : $ROLLBACK_IMAGE"
            docker pull "$ROLLBACK_IMAGE"

            # Forcer l'image précédente dans le compose
            REGISTRY_IMAGE="$ROLLBACK_IMAGE" $DC up -d --force-recreate --scale backend=2 backend

            sleep 15
            curl -fsS "http://localhost:8000/health" && echo "✅ Rollback réussi" || echo "❌ Rollback échoué — intervention manuelle requise"
