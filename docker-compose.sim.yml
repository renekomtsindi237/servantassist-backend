# ServantAssist — Docker Compose pour simulation locale (sans conflits de ports)
# Usage:
#   docker compose -f docker-compose.sim.yml up -d
#   docker compose -f docker-compose.sim.yml exec backend alembic upgrade head
#   docker compose -f docker-compose.sim.yml exec backend python scripts/init_db.py
#   docker compose -f docker-compose.sim.yml down

services:
  # ── PostgreSQL dédié ServantAssist (port 5433 pour éviter conflits) ──────
  sa-db:
    image: postgres:16-alpine
    container_name: servantassist-sim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: servantassist
      POSTGRES_PASSWORD: servantassist_password
      POSTGRES_DB: servantassist_db
    ports:
      - "5433:5432"
    volumes:
      - sa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servantassist -d servantassist_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend ServantAssist ──────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: servantassist-backend-dev:latest
    container_name: servantassist-sim-backend
    restart: unless-stopped
    depends_on:
      sa-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DATABASE_URL: "postgresql+asyncpg://servantassist:servantassist_password@sa-db:5432/servantassist_db"
      # Redis : réutilise celui déjà en marche (external)
      REDIS_URL: "redis://host.docker.internal:6379/1"
