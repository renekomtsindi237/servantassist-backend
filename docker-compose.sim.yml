      ALLOWED_HOSTS: '["localhost","127.0.0.1","localhost:8000"]'
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:4200"]'
      TRUST_PROXY_HEADERS: "false"
      LOGIN_MAX_ATTEMPTS: "50"
