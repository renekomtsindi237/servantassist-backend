[flake8]
max-line-length = 120
exclude = .git,__pycache__,.venv,venv,env,migrations
ignore = E203,E266,W503,F403,F401
per-file-ignores =
    __init__.py:F401

[isort]
profile = black
multi_line_output = 3
line_length = 120
known_first_party = src

[mypy]
python_version = 3.12
ignore_missing_imports = True
no_strict_optional = True
warn_return_any = True
warn_unused_configs = True

[tool:pytest]
asyncio_mode = auto

