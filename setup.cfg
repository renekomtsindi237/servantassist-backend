[flake8]
max-line-length = 120
exclude = .git,__pycache__,.venv,venv,env,migrations
ignore = E203,E266,W503,F403,F401,E704,E402,E226
per-file-ignores =
    __init__.py:F401
    src/infrastructure/services/email_templates.py:E501
    tests/seed_and_test.py:E501,F541

[isort]
profile = black
multi_line_output = 3
line_length = 120
known_first_party = src


