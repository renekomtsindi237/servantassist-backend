# ──────────────────────────────────────────────────────────────────────────────
# ServantAssist — Docker Compose STAGING (Haute Disponibilité)
# Base de données : Supabase (externe)
#
# Architecture :
#   nginx-lb → 2 réplicas backend (Gunicorn+Uvicorn) → Redis → Supabase
#
# Commandes :
#   Démarrer      : docker compose -f docker-compose.staging.yml up -d
#   Scaler        : docker compose -f docker-compose.staging.yml up -d --scale backend=3
#   Migrations    : docker compose -f docker-compose.staging.yml --profile migrate run --rm migrate
#   Logs          : docker compose -f docker-compose.staging.yml logs -f
#   Arrêter       : docker compose -f docker-compose.staging.yml down
#
# Prérequis : .env.staging rempli
# ──────────────────────────────────────────────────────────────────────────────
services:

  # ── Nginx — Load Balancer ─────────────────────────────────────────────────
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: servantassist-staging-lb
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: servantassist-staging-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (network_mode: host — bypass IPv6 bridge, accès direct Supabase)
  backend:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    container_name: servantassist-backend-backend-1
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      REDIS_URL: "redis://127.0.0.1:6379/0"
      APP_PORT: "9099"
      GUNICORN_WORKERS: "2"
    volumes:
      - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "8", "http://localhost:9099/ready"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── Migration (one-shot — profil "migrate") ────────────────────────────────
  migrate:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    container_name: servantassist-staging-migrate
    profiles: [migrate]
    network_mode: host
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
    command: alembic upgrade head

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery-worker:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    container_name: servantassist-staging-celery
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      REDIS_URL: "redis://127.0.0.1:6379/0"
    command: celery -A src.infrastructure.tasks.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.infrastructure.tasks.celery_app inspect ping --timeout 5 2>&1 | grep -qi pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── Celery Beat ────────────────────────────────────────────────────────────
  celery-beat:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    container_name: servantassist-staging-beat
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      REDIS_URL: "redis://127.0.0.1:6379/0"
    command: celery -A src.infrastructure.tasks.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "grep -qa beat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ── Réseau bridge pour redis + nginx-lb (backend sur host network) ──────────
networks:
  default:
    driver: bridge
