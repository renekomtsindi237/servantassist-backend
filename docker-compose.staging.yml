# ──────────────────────────────────────────────────────────────────────────────
# ServantAssist — Docker Compose STAGING (Haute Disponibilité)
# Base de données : Supabase (externe)
#
# Architecture :
#   nginx-lb → 2 réplicas backend (Gunicorn+Uvicorn) → Redis → Supabase
#
# Commandes :
#   Démarrer      : docker compose -f docker-compose.staging.yml up -d
#   Scaler        : docker compose -f docker-compose.staging.yml up -d --scale backend=3
#   Migrations    : docker compose -f docker-compose.staging.yml --profile migrate run --rm migrate
#   Logs          : docker compose -f docker-compose.staging.yml logs -f
#   Arrêter       : docker compose -f docker-compose.staging.yml down
#
# Prérequis : .env.staging rempli
# ──────────────────────────────────────────────────────────────────────────────
services:

  # ── Nginx — Load Balancer ─────────────────────────────────────────────────
  nginx-lb:
    image: nginx:1.27-alpine
    container_name: servantassist-staging-lb
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Sans mot de passe : Redis est interne au réseau Docker, non exposé à l'hôte.
  redis:
    image: redis:7-alpine
    container_name: servantassist-staging-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (2 réplicas par défaut) ──────────────────────────────────────
  # Pas de container_name — Docker Compose nomme automatiquement les réplicas
  # Pas de port exposé directement — le trafic passe par nginx-lb
  backend:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
      REDIS_URL: "redis://redis:6379/0"
      GUNICORN_WORKERS: "2"      # 2 workers par réplica (staging léger)
    volumes:
      - ./gunicorn.conf.py:/app/gunicorn.conf.py:ro
    tmpfs:
      - /tmp:size=100M,noexec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ── Migration (one-shot — profil "migrate") ────────────────────────────────
  migrate:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    container_name: servantassist-staging-migrate
    profiles: [migrate]
    network_mode: host
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      APP_DEBUG: "false"
    command: alembic upgrade head

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery-worker:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    container_name: servantassist-staging-celery
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      REDIS_URL: "redis://redis:6379/0"
    command: celery -A src.infrastructure.tasks.celery_app worker --loglevel=info --concurrency=2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Celery Beat ────────────────────────────────────────────────────────────
  celery-beat:
    image: ghcr.io/renekomtsindi237/servantassist-backend/servantassist-backend:staging
    container_name: servantassist-staging-beat
    restart: unless-stopped
    depends_on:
      - redis
      - celery-worker
    env_file:
      - .env.staging
    environment:
      APP_ENV: staging
      REDIS_URL: "redis://redis:6379/0"
    command: celery -A src.infrastructure.tasks.celery_app beat --loglevel=info
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# ── Réseau avec IPv6 activé (requis pour Supabase IPv6-only) ───────────────
networks:
  default:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: "172.28.0.0/16"
        - subnet: "fd42:dead:beef::/48"
