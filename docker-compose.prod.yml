# ──────────────────────────────────────────────────────────────────────────
# ServantAssist Backend — Docker Compose Production Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# POURQUOI volumes: [] ?
#   En dev, le volume ".:/app" monte le code source local pour le hot-reload.
#   En production, le code est fige dans l'image Docker au build.
#   C'est le principe du deploiement IMMUABLE :
#     - Le code qui passe le CI est exactement celui qui tourne
#     - Rollback = redeployer l'image precedente
#     - Pas de modification possible a l'execution
#   Le volume "pgdata" de la DB est herite de docker-compose.yml et persiste.
# ──────────────────────────────────────────────────────────────────────────
version: "3.9"

services:
  backend:
    build:
      target: production
    restart: always
    # Pas de volume source en production (code fige dans l'image)
    volumes: []
    environment:
      APP_ENV: production
      APP_DEBUG: "False"
    # ── Durcissement securite Docker ──────────────────────────────────
    security_opt:
      - no-new-privileges:true    # Empeche l'escalade de privileges
    read_only: true               # Filesystem en lecture seule
    tmpfs:
      - /tmp:size=100M,noexec     # Seul /tmp est inscriptible (pas d'execution)
    cap_drop:
      - ALL                       # Supprime TOUTES les capabilities Linux
    cap_add:
      - NET_BIND_SERVICE          # Seule capability necessaire (port 8000)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  db:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ── Durcissement DB ──────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Empecher l'acces externe en prod (pas de ports:)
    ports: !override []

  redis:
    restart: always
    # ── Durcissement Redis ───────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Redis en mode protected (pas d'acces externe)
    ports: !override []
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:-}
        --rename-command FLUSHALL ""
        --rename-command FLUSHDB ""
        --rename-command CONFIG ""
        --rename-command DEBUG ""
