global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'servantassist'
    environment: 'production'

scrape_configs:
  - job_name: 'servantassist-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
