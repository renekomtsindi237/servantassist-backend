# ──────────────────────────────────────────────────────────────────────────
# Nginx — Load Balancer interne ServantAssist Backend
# Distribue le trafic sur les réplicas du service "backend"
# Nginx résout "backend" via le DNS interne Docker (toutes les IPs de réplicas)
# ──────────────────────────────────────────────────────────────────────────

upstream servantassist_backend {
    least_conn;

    # Backend sur host network — accessible via host-gateway (extra_hosts dans compose)
    server host.docker.internal:9000 fail_timeout=5s max_fails=3;

    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # ── Timeouts ──────────────────────────────────────────────────────────
    proxy_connect_timeout       10s;
    proxy_send_timeout          120s;
    proxy_read_timeout          120s;

    # ── Headers transmis au backend ───────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # ── WebSocket support ─────────────────────────────────────────────────
    location /api/v1/communication/ws {
        proxy_pass         http://servantassist_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # ── Health check Nginx (ne passe pas au backend) ──────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Tout le reste → upstream backend ─────────────────────────────────
    location / {
        proxy_pass http://servantassist_backend;

        # Retry automatique si un replica tombe (sauf POST pour éviter les doublons)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}
